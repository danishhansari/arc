spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service
              uri: http://localhost:5004
              predicates:
                - Path=/user/**
              filters:
                - RewritePath=/user/(?<segment>.*), /v1/api/${segment}

            - id: issue-service
              uri: http://localhost:5003
              predicates:
                - Path=/issue/**
              filters:
                - RewritePath=/issue/(?<segment>.*), /v1/api/${segment}
  application:
    name: api-gateway
server:
  port: 8080
jwt:
  secret:
    key: "thispasswordisverytoughtocrackevenicant"